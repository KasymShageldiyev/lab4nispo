apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replica-demo
  namespace: lab4
spec:
  replicas: 3
  selector:
    matchLabels:
      app: replica-demo
  template:
    metadata:
      labels:
        app: replica-demo
    spec:
      containers:
        - name: busybox
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 86400"]
