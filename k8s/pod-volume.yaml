apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
  namespace: lab4
spec:
  containers:
    - name: writer
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: shared-data
          mountPath: /data
    - name: reader
      image: busybox:1.37.0
      command: ["sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared
          readOnly: true
  volumes:
    - name: shared-data
      emptyDir: {}
